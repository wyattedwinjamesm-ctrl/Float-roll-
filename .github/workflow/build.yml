name: Build FloatRoll APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FloatRollOverlay"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_2
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.floatroll"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.floatroll"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:label="FloatRoll"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating dice overlay" />
                  </service>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/java/com/floatroll
          cat > app/src/main/java/com/floatroll/MainActivity.kt <<'EOF_5'
          package com.floatroll

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(64, 64, 64, 64)
                      setBackgroundColor(Color.parseColor("#1D1A2E"))
                  }
                  col.addView(TextView(this).apply {
                      text = "FloatRoll needs permission to draw over other apps."
                      setTextColor(Color.parseColor("#F4EFE2"))
                      textSize = 16f
                      gravity = Gravity.CENTER
                  })
                  col.addView(Button(this).apply {
                      text = "Start floating dice"
                      setOnClickListener { start() }
                  })
                  setContentView(col)
              }

              private fun start() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                      return
                  }
                  startForegroundService(Intent(this, OverlayService::class.java))
                  moveTaskToBack(true)
              }
          }
          EOF_5
          mkdir -p app/src/main/java/com/floatroll
          cat > app/src/main/java/com/floatroll/OverlayService.kt <<'EOF_6'
          package com.floatroll

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.webkit.WebView
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.abs

          class OverlayService : Service() {

              private val appUrl = "https://float-roll-go.base44.app"

              private lateinit var wm: WindowManager
              private lateinit var root: FrameLayout
              private lateinit var lp: WindowManager.LayoutParams
              private lateinit var bubble: TextView
              private lateinit var panel: LinearLayout
              private lateinit var web: WebView

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val n = buildNotification()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  buildOverlay()
              }

              private fun buildNotification(): Notification {
                  val ch = NotificationChannel("float", "Floating dice", NotificationManager.IMPORTANCE_MIN)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  return Notification.Builder(this, "float")
                      .setContentTitle("FloatRoll is running")
                      .setContentText("Tap the floating d20 to roll")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .build()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              @SuppressLint("SetJavaScriptEnabled")
              private fun buildOverlay() {
                  root = FrameLayout(this)

                  bubble = TextView(this).apply {
                      text = "20"
                      gravity = Gravity.CENTER
                      textSize = 20f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#1D1A2E"))
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#F2B94B"))
                          setStroke(dp(3), Color.parseColor("#1D1A2E"))
                      }
                      layoutParams = FrameLayout.LayoutParams(dp(58), dp(58))
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(14), dp(4), dp(6), dp(4))
                      setBackgroundColor(Color.parseColor("#2C2748"))
                  }
                  header.addView(TextView(this).apply {
                      text = "FloatRoll"
                      setTextColor(Color.parseColor("#A9A3C4"))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  })
                  header.addView(headerButton("\u2212") { setExpanded(false) })
                  header.addView(headerButton("\u00D7") { stopSelf() })

                  web = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      setBackgroundColor(Color.parseColor("#1D1A2E"))
                      layoutParams = LinearLayout.LayoutParams(dp(300), dp(380))
                      loadUrl(appUrl)
                  }

                  panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      background = GradientDrawable().apply {
                          cornerRadius = dp(14).toFloat()
                          setColor(Color.parseColor("#1D1A2E"))
                      }
                      clipToOutline = true
                  }
                  panel.addView(header)
                  panel.addView(web)

                  root.addView(bubble)
                  root.addView(panel)

                  lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(16)
                      y = dp(160)
                  }

                  makeDraggable(bubble) { setExpanded(true) }
                  makeDraggable(header)
                  wm.addView(root, lp)
              }

              private fun headerButton(label: String, onClick: () -> Unit) = TextView(this).apply {
                  text = label
                  textSize = 22f
                  setTextColor(Color.parseColor("#F4EFE2"))
                  setPadding(dp(12), 0, dp(12), 0)
                  setOnClickListener { onClick() }
              }

              private fun setExpanded(open: Boolean) {
                  bubble.visibility = if (open) View.GONE else View.VISIBLE
                  panel.visibility = if (open) View.VISIBLE else View.GONE
                  root.post { clampToScreen() }
              }

              private fun clampToScreen() {
                  val m = resources.displayMetrics
                  lp.x = lp.x.coerceIn(0, maxOf(0, m.widthPixels - root.width))
                  lp.y = lp.y.coerceIn(0, maxOf(0, m.heightPixels - root.height))
                  wm.updateViewLayout(root, lp)
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun makeDraggable(handle: View, onTap: (() -> Unit)? = null) {
                  var sx = 0f; var sy = 0f; var ox = 0; var oy = 0; var moved = false
                  handle.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { sx = e.rawX; sy = e.rawY; ox = lp.x; oy = lp.y; moved = false }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - sx).toInt(); val dy = (e.rawY - sy).toInt()
                              if (abs(dx) + abs(dy) > dp(6)) moved = true
                              if (moved) { lp.x = ox + dx; lp.y = oy + dy; clampToScreen() }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) onTap?.invoke()
                      }
                      true
                  }
              }

              override fun onDestroy() {
                  if (::root.isInitialized) wm.removeView(root)
                  if (::web.isInitialized) web.destroy()
                  super.onDestroy()
              }
          }
          EOF_6
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FloatRoll-apk
          path: app/build/outputs/apk/debug/app-debug.apk
